# Deploy-server compose: runs the prebuilt image loaded with `docker load` (no source, no build).
# Production:  docker compose up -d app            (DB_* in .env points at your SQL Server 2016)
#              docker compose run --rm migrate      (once per release, privileged login)
# See DEPLOY.md.
name: consent-cookie

x-hardening: &hardening
  image: consent-cookie:${IMAGE_TAG:-1.0.0}
  pull_policy: never
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  env_file: .env

services:
  app:
    <<: *hardening
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    <<: *hardening
    profiles: [migrate]
    command: ["node", "apps/server/dist/db/migrate.js"]
    restart: "no"
